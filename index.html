<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#BD2435" />
  <meta name="description" content="PRIMA SECOND HOME — everything about your stay in PRIMA buildings" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PRIMA Home" />
  <title>PRIMA SECOND HOME</title>
  <style>
    html, body { margin: 0; padding: 0; background: #F6F2EE; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    body { font-family: 'Manrope', 'Noto Sans Devanagari', system-ui, sans-serif; }
    #root { min-height: 100vh; min-height: 100dvh; }
    .pre-mount { display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #BD2435; font-weight: 700; font-size: 14px; }
  </style>
</head>
<body>
  <div id="root"><div class="pre-mount">PRIMA · Loading…</div></div>
  <script>
    /* Strážca zaseknutého štartu (prevzaté z PRIMA RE SERVICE v10.10): ak sa appka
       do 8 s nenamountuje a sme online, odregistruje service workery, zmaže cache
       a reloadne. Max. 2 pokusy za session, offline sa nič nemaže. */
    (function () {
      var t = setTimeout(function () {
        try {
          if (!document.querySelector('.pre-mount')) return;
          if (navigator.onLine === false) return;
          var n = +(sessionStorage.getItem('primaHomeBootRetry') || 0);
          if (n >= 2) return;
          sessionStorage.setItem('primaHomeBootRetry', String(n + 1));
          var work = [];
          if ('serviceWorker' in navigator) {
            work.push(navigator.serviceWorker.getRegistrations()
              .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          }
          if (window.caches && caches.keys) {
            work.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          }
          Promise.all(work).catch(function () {}).then(function () { location.reload(); });
        } catch (e) {}
      }, 8000);
      window.__primaBootOk = function () { clearTimeout(t); try { sessionStorage.removeItem('primaHomeBootRetry'); } catch (e) {} };
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
